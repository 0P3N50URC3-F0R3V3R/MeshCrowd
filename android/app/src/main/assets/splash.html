<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#1e1f22;color:#dbdee1;font-family:sans-serif}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
.ghost{width:96px;height:96px;margin-bottom:28px}
.stage{width:84px;height:84px;margin:8px auto 22px;perspective:420px}
.tilt{position:relative;width:100%;height:100%;transform-style:preserve-3d;animation:sway 4s ease-in-out infinite}
.ring{position:absolute;inset:0;border-radius:50%;border:7px solid transparent;border-top-color:#14b8a6;border-right-color:#0d9488;transform-style:preserve-3d;animation:spin 1.1s linear infinite}
.ring::after{content:"";position:absolute;top:50%;right:-12px;width:0;height:0;margin-top:-3px;border-style:solid;border-width:9px 8px 0 8px;border-color:#0d9488 transparent transparent transparent}
.ring.back{transform:translateZ(-10px);opacity:.35;border-top-color:#0d9488;border-right-color:#0b7a70;animation-name:spin-back}
.ring.mid{transform:translateZ(-5px);opacity:.6;animation-name:spin-mid}
.ring.front{filter:drop-shadow(0 4px 6px rgba(0,0,0,.55))}
@keyframes spin{to{transform:translateZ(0) rotateZ(360deg)}}
@keyframes spin-mid{to{transform:translateZ(-5px) rotateZ(360deg)}}
@keyframes spin-back{to{transform:translateZ(-10px) rotateZ(360deg)}}
@keyframes sway{0%,100%{transform:rotateX(55deg) rotateY(-14deg)}50%{transform:rotateX(38deg) rotateY(14deg)}}
h1{margin:0 0 6px;font-size:20px;color:#f2f3f5;font-weight:600}
p{margin:0;color:#949ba4;font-size:14px;word-break:break-all}
</style></head><body>
<svg class="ghost" viewBox="0 0 24 24"><path fill="#fff" fill-rule="evenodd" d="M6 8c0-2.2 2.7-4 6-4s6 1.8 6 4v6.5c0 3.6-3.1 5.5-6 5.5s-6-1.9-6-5.5zM9.5 12m-1.3 0a1.3 1.3 0 1 0 2.6 0a1.3 1.3 0 1 0-2.6 0M14.5 12m-1.3 0a1.3 1.3 0 1 0 2.6 0a1.3 1.3 0 1 0-2.6 0"/></svg>
<h1 id="title">MeshCrowd</h1>
<p id="sub"></p>
<div class="stage"><div class="tilt"><div class="ring back"></div><div class="ring mid"></div><div class="ring front"></div></div></div>
<script>
var q = new URLSearchParams(location.search);
var hu = (navigator.language || '').slice(0, 2).toLowerCase() === 'hu';
var name = q.get('name') || q.get('host') || '';
document.getElementById('sub').textContent = name ? (hu ? name + ' betöltése…' : 'Loading ' + name + '…') : (hu ? 'Betöltés…' : 'Loading…');
</script>
</body></html>
